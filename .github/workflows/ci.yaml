name: ci

# The checks of this repository, from the shared CI template of
# abap2UI5-addons (rap-ext, .github/ci/README.md):
#
#   abaplint      Standard ABAP (abaplint.json)
#   abap2ui5lint  the abap2UI5 front end and its views (abap2ui5lint.jsonc),
#                 on main the README badges, published to the branch `badges`
#
# No ABAP Cloud lint: Transport of Copies is classic ABAP (the report ZTOC with
# its selection screen, function groups, the TR_* function modules), which
# ABAP Cloud does not have - AGENTS.md, CI. No 702 branch, no ABAP Unit tests
# and no rename script here. abap2UI5 is resolved from its main branch with no
# version pin: the weekly run notices an upstream rename while no pull request
# is open.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # write only for publish-badges, which runs on main and never for a pull
    # request; every job that runs the code keeps a read-only token
    permissions:
      contents: write
    uses: abap2UI5-addons/rap-ext/.github/workflows/addon-check.yaml@c81dfd461f69e42bb3678f51f80804066e2c9f96 # ci-v1.0.0
    with:
      abaplint: '["./abaplint.json"]'
      canary: ${{ github.event_name == 'schedule' }}
